[package]
name = "gpui-pre-web"
version = "0.3.8"
edition = "2024"
publish = false
description = "gpui-fast-web under the name and version of the gpui-pre snapshot gpui-kit pins"

[lib]
name = "gpui_web"
path = "lib.rs"
doctest = false

[features]
default = ["gpui_fast_web/default"]
multithreaded = ["gpui_fast_web/multithreaded"]

[dependencies]
gpui_fast_web = { package = "gpui-fast-web", version = "=0.1.4", default-features = false }
