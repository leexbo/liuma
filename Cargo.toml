[workspace]
resolver = "3"
members = [
    "crates/liuma",
    "crates/liuma-app",
    "crates/liuma-compaction",
    "crates/liuma-desktop",
    "crates/liuma-core",
    "crates/liuma-mcp",
    "crates/liuma-skill",
    "crates/liuma-wit",
    "crates/liuma-hooks",
    "crates/liuma-host",
    "crates/liuma-llm",
    "crates/liuma-sandbox",
    "crates/liuma-session",
    "crates/liuma-attachment",
    "crates/liuma-plan",
    "crates/liuma-agent-loop",
    "crates/liuma-decision",
    "crates/liuma-prompt",
    "crates/liuma-tools",
    "crates/liuma-example-tool",
    "crates/liuma-sandbox-winacl",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"

# 棘轮:生产代码禁 unwrap/expect(测试经 clippy.toml 放行);
# 例外 = AGENTS.md §1 ①,逐点 #[allow] + 前提说明登记。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# 已导入类型不得再写全限定路径(IDE 同款诊断;冗余前缀不再积累)
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
jsonpath-rust = "1.0"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
wit-parser = "0.261.0"
tokio = { version = "1", features = ["full"] }
wasmtime = { version = "49", features = ["async"] }
wasmtime-wasi = "49"
turso = { version = "0.8.1", features = ["fts"] }
# /export ZIP 打包(stored 条目 + deflate)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# 用户主题目录监听(kits/theme:init_user_themes;与 gpui-component 的
# notify 依赖保持同大版,锁单一实例 = 单一 watcher 栈)
notify = "8"
# notify 回调线程 → 主循环 async 通道(与 gpui 运行时同源)
smol = "2"
futures = "0.3"
# rig provider 层(0.44;四评+spike 后转生产,自有 HttpClientExt 传输,hosted 工具回放走 rig Opaque)
rig-core = "0.44.0"
rig-http = "0.44.0"
bytes = "1"
async-stream = "0.3"
libc = "0.2"
# gpui-pre FileDropEvent 载荷构造(与其共用 1.x)
smallvec = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# preset manifest 解析(serde_yaml 的接棒 fork)
yaml_serde = "0.10"
wit-bindgen = "0.62"
liuma-app = { path = "crates/liuma-app" }
liuma-attachment = { path = "crates/liuma-attachment" }
liuma-core = { path = "crates/liuma-core" }
liuma-hooks = { path = "crates/liuma-hooks" }
liuma-host = { path = "crates/liuma-host" }
liuma-session = { path = "crates/liuma-session" }
liuma-compaction = { path = "crates/liuma-compaction" }
liuma-plan = { path = "crates/liuma-plan" }
liuma-wit = { path = "crates/liuma-wit" }
liuma-agent-loop = { path = "crates/liuma-agent-loop" }
liuma-decision = { path = "crates/liuma-decision" }
liuma-prompt = { path = "crates/liuma-prompt" }
liuma-tools = { path = "crates/liuma-tools" }
liuma-llm = { path = "crates/liuma-llm" }
liuma-mcp = { path = "crates/liuma-mcp" }
liuma-skill = { path = "crates/liuma-skill" }
liuma-sandbox = { path = "crates/liuma-sandbox" }
portable-pty = "0.9.0"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
uuid = { version = "1", features = ["v4", "v7"] }
# GPUI 桌面门面:重导出 gpui + component/base/assets,升级走 semver。
# features = ["gpui-fast"](官方 #3375)把核心切到 gpui-fast 族(retained-mode
# 布局引擎),门面与宏不变;缺该 feature 会静默回退 gpui-pre 后端——守卫见
# AGENTS.md §1 [Deps]。
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
# 终端仿真(VT 状态机/网格/scrollback;桌面右侧终端面板)。0.x 无 semver
# 承诺,按 merman 先例锁死;vte 解析器由其重导出,不直依赖
alacritty_terminal = "=0.26.0"
# Mermaid → SVG(引擎选型见 kits/mermaid.rs);精确锁死防漂移。
# 0.8 起家族选择器是独立维度(output/layout feature 不再隐含语言解析),
# default-features 关掉是为了避开默认集里的 ELK 编译(EPL-2.0);
# 布局锁 cytoscape。usvg ^0.47(merman 必依赖)与自家 0.48 并存:
# gpui 生态自身就 resvg 0.45.1/0.46.0 两版,SVG 仅字符串交换无类型冲突
merman = { version = "=0.9.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
# Mermaid 查看器视口裁剪光栅(自家光栅档;gpui 链自带 0.45/0.46,并存)
resvg = "0.48.1"
usvg = "0.48.1"
# macOS Dock 图标运行时绘制(objc2 系与 gpui 同源锁定)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = "0.3"
# macOS 钥匙串凭据(非 macOS 平台该级缺席)
# 附件图片解码校验(与 gpui 锁同版)
image = "0.25"
sha2 = "0.11.0"
hex = "0.4"
# MCP client(stdio + streamable-http)
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# 桌面 UI 文案(rust-i18n)。必须与 gpui-kit→gpui-component 解析到同一 4.2.x:
# CURRENT_LOCALE 是 rust-i18n 的进程级单例,双版本 = 双语言盘,库层文案不跟随。
rust-i18n = "4.2.1"
# 附件 wire 编码(base64 / data URL)
base64 = "0.23"
# PDF 预览:pdf-syntax 解析 + 纯 Rust 栅格化(pdf-render 重导出;无 C 交付物)
pdf-render = "1.0"
# Windows 沙箱后端(受限令牌 / 能力 SID 授权 / Job Object)。纯 Rust 绑定,
# 无 C 交付物;feature 集由消费方按需声明
windows-sys = { version = "0.61", default-features = false }

[profile.dev]
# 全量 debuginfo 下 wasmtime+turso 构建达数十 GB;行号表足够日常调试
debug = "line-tables-only"

# 热点依赖 debug 下走优化;包名 = crates.io 真实名。gpui-kit features=
# ["gpui-fast"] 激活 gpui-fast 后端,gpui-pre(同快照 stock)仍在图中共存,
# 两者都按热点处理
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-macros = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[profile.release]
lto = "thin"
strip = "symbols"
