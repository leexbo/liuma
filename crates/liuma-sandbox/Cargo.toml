[package]
name = "liuma-sandbox"
description = "执行原语:OS 沙箱链(fail-closed)与受控 spawn/PTY"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror.workspace = true
tokio.workspace = true
libc.workspace = true
portable-pty.workspace = true
# 契约侧(SID 派生 / argv 形态 / 归一化)全平台编译,winacl.rs 与 sandbox.rs
# 的方言表无条件引用它——按 cfg 门控依赖会让非 Windows 直接编译失败
liuma-sandbox-winacl = { path = "../liuma-sandbox-winacl" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Globalization"]
