[package]
name = "liuma-desktop"
description = "liuma 桌面客户端:GPUI 原生 UI,进程内直连 liuma-core 宿主"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "liuma-desktop"
path = "src/main.rs"

[dependencies]
image.workspace = true
base64.workspace = true
# PDF 预览(解析 + 纯 Rust 栅格化;features/preview/pdf.rs)
pdf-render.workspace = true
liuma-attachment.workspace = true
# 右侧终端面板的 VT 仿真引擎(features/terminal)
alacritty_terminal.workspace = true
# 终端 PTY 的 PtySize 尺寸面(spawn/resize 与 liuma-sandbox 对齐)
portable-pty.workspace = true
liuma-core.workspace = true
# 用户主题目录根(LIUMA_HOME|~/.liuma;kits/theme 用户主题装配)
liuma-host.workspace = true
liuma-llm.workspace = true
# 平台 shell 名(`bash` / `pwsh`):工具摘要的键序表按模型面工具名索引
liuma-sandbox.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
# GPUI Kit 门面:重导出 gpui(=gpui-pre)+ component/base/assets
smallvec.workspace = true
# tree-sitter = 预览代码高亮(Zed 同款管线;29 种语言聚合,
# SyntaxHighlighter 独立使用经 gpui-kit 透传;MCP JSON 粘贴区共用)
gpui-kit = { workspace = true, features = ["tree-sitter", "tree-sitter-languages"] }
# 界面文案:唯一文案系统(rust-i18n;装配见 kits/i18n)
rust-i18n.workspace = true
# Mermaid 图渲染(markdown```mermaid 围栏 → SVG → gpui 光栅;kits/mermaid.rs)
merman.workspace = true
# 查看器视口裁剪光栅(resvg 根变换只渲染可见区;与 gpui 锁同版)
resvg.workspace = true
usvg.workspace = true
# 语法高亮(read 卡/markdown 代码块;default-fancy = fancy-regex 后端,零 C 依赖)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# 用户主题目录文件监听(kits/theme:init_user_themes;与 gpui-component
# 的 notify 依赖保持同大版,锁单一实例)
notify.workspace = true
# notify 事件 → 主循环 async 通道(去抖静默合并)
smol.workspace = true
# 轨迹 Started 时刻/时间线 tooltip 的本地时区格式化
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 浏览器面板地址栏 URL 规范化(features/browser)
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Dock 图标运行时绘制(app_icon.rs);objc2 系与 gpui 同源,纯绑定无 C 交付物
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
# 浏览器面板 WKWebView 嵌入(features/browser/native.rs)
objc2-web-kit.workspace = true
# Window → NSView 原生句柄(HasWindowHandle trait)
raw-window-handle.workspace = true

[dev-dependencies]
# test-support 经 gpui-kit 透传到 gpui(features 树内 union)
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
